<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250" style="background: #060913; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.4);">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient-ana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712" />
      <stop offset="50%" stop-color="#0b1126" />
      <stop offset="100%" stop-color="#140f29" />
    </linearGradient>

    <!-- Glowing Violet/Cyan Accent Gradients -->
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Filters for Glows -->
    <filter id="glow-ana" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="1" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="vertical-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="15%" stop-color="#000" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Looping Animations */
    @keyframes bar-grow-1 {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(0.9); }
    }
    @keyframes bar-grow-2 {
      0%, 100% { transform: scaleY(0.7); }
      50% { transform: scaleY(0.3); }
    }
    @keyframes bar-grow-3 {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(0.85); }
    }
    @keyframes bar-grow-4 {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(0.75); }
    }

    @keyframes pulse-node-ana {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.9)); }
    }

    @keyframes connection-flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pipeline-scroll {
      0%, 12% { transform: translateY(0px); }
      16%, 28% { transform: translateY(-24px); }
      32%, 44% { transform: translateY(-48px); }
      48%, 60% { transform: translateY(-72px); }
      64%, 76% { transform: translateY(-96px); }
      80%, 92% { transform: translateY(-120px); }
      96%, 100% { transform: translateY(-144px); }
    }

    @keyframes scatter-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Animation classes */
    .bar-1 { animation: bar-grow-1 3s ease-in-out infinite; transform-origin: bottom; }
    .bar-2 { animation: bar-grow-2 4s ease-in-out infinite; transform-origin: bottom; }
    .bar-3 { animation: bar-grow-3 3.5s ease-in-out infinite; transform-origin: bottom; }
    .bar-4 { animation: bar-grow-4 2.8s ease-in-out infinite; transform-origin: bottom; }
    
    .pulsing-node-ana { animation: pulse-node-ana 4s ease-in-out infinite; }
    .scrolling-pipeline { animation: pipeline-scroll 16s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 4 4; animation: connection-flow 2s linear infinite; }
    .scatter-dot { animation: scatter-pulse 3s ease-in-out infinite; transform-origin: center; }

    .grid-line-ana {
      stroke: #1e293b;
      stroke-width: 0.5;
    }
  </style>

  <!-- Background Base -->
  <rect width="800" height="250" fill="url(#bg-gradient-ana)" />

  <!-- Abstract Analytics Grid lines -->
  <g opacity="0.3">
    <line class="grid-line-ana" x1="100" y1="0" x2="100" y2="250" />
    <line class="grid-line-ana" x1="220" y1="0" x2="220" y2="250" />
    <line class="grid-line-ana" x1="600" y1="0" x2="600" y2="250" />
    <line class="grid-line-ana" x1="700" y1="0" x2="700" y2="250" />
    <line class="grid-line-ana" x1="0" y1="60" x2="800" y2="60" />
    <line class="grid-line-ana" x1="0" y1="180" x2="800" y2="180" />
  </g>

  <!-- Left: Neural Network/Clustering Graph -->
  <g transform="translate(40, 25)">
    <!-- Connections -->
    <line x1="50" y1="50" x2="110" y2="30" stroke="#a78bfa" stroke-width="1.5" class="flow-line" />
    <line x1="50" y1="50" x2="80" y2="110" stroke="#22d3ee" stroke-width="1.5" class="flow-line" style="animation-delay: 0.5s;" />
    <line x1="110" y1="30" x2="140" y2="90" stroke="#f472b6" stroke-width="1.5" class="flow-line" style="animation-delay: 0.8s;" />
    <line x1="80" y1="110" x2="140" y2="90" stroke="#22d3ee" stroke-width="1.5" class="flow-line" />
    <line x1="80" y1="110" x2="50" y2="160" stroke="#a78bfa" stroke-width="1.5" class="flow-line" style="animation-delay: 0.3s;" />
    <line x1="140" y1="90" x2="110" y2="170" stroke="#f472b6" stroke-width="1.5" class="flow-line" style="animation-delay: 1.2s;" />
    <line x1="50" y1="160" x2="110" y2="170" stroke="#22d3ee" stroke-width="1.5" class="flow-line" />

    <!-- Nodes -->
    <circle cx="50" cy="50" r="7" fill="url(#cyan-glow)" class="pulsing-node-ana" />
    <circle cx="110" cy="30" r="9" fill="url(#violet-glow)" class="pulsing-node-ana" style="animation-delay: 0.8s;" />
    <circle cx="80" cy="110" r="10" fill="url(#pink-glow)" class="pulsing-node-ana" style="animation-delay: 1.5s;" />
    <circle cx="140" cy="90" r="8" fill="url(#cyan-glow)" class="pulsing-node-ana" style="animation-delay: 0.4s;" />
    <circle cx="50" cy="160" r="7" fill="url(#violet-glow)" class="pulsing-node-ana" style="animation-delay: 1.2s;" />
    <circle cx="110" cy="170" r="9" fill="url(#pink-glow)" class="pulsing-node-ana" style="animation-delay: 2s;" />

    <!-- Text descriptors for data analysis theme -->
    <text x="95" y="210" font-size="10" fill="#475569" font-weight="700" letter-spacing="1" text-anchor="middle" font-family="monospace">NEURAL_NET_NODES</text>
  </g>

  <!-- Center: ML Data Pipeline Terminal (Logs Scroll) -->
  <g transform="translate(250, 25)">
    <rect width="360" height="200" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.5" />
    <!-- Terminal Title Header -->
    <rect width="360" height="30" rx="8" fill="#0b0f19" />
    <rect y="20" width="360" height="10" fill="#0b0f19" />
    <line x1="0" y1="30" x2="360" y2="30" stroke="#1e293b" stroke-width="1" />

    <!-- macOS dot window controls -->
    <circle cx="15" cy="15" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="27" cy="15" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="39" cy="15" r="4.5" fill="#10b981" opacity="0.8" />
    
    <text x="180" y="20" font-size="11" fill="#475569" font-weight="700" text-anchor="middle" font-family="monospace">ml_data_pipeline.py</text>
    
    <!-- Logging Viewport -->
    <g transform="translate(15, 45)">
      <clipPath id="pipeline-clip">
        <rect width="330" height="140" />
      </clipPath>

      <g clip-path="url(#pipeline-clip)">
        <!-- scrolling log container -->
        <g class="scrolling-pipeline" font-family="monospace" font-size="11" font-weight="500">
          <g transform="translate(0, 15)">
            <text fill="#38bdf8">[DF_LOAD]</text>
            <text x="75" fill="#94a3b8">df = pd.read_csv('metrics.csv')</text>
          </g>
          <g transform="translate(0, 39)">
            <text fill="#10b981">[CLEAN]</text>
            <text x="75" fill="#e2e8f0">Handling missing values... OK</text>
          </g>
          <g transform="translate(0, 63)">
            <text fill="#a78bfa">[TRAIN]</text>
            <text x="75" fill="#e2e8f0">Fitting random forest classifer</text>
          </g>
          <g transform="translate(0, 87)">
            <text fill="#ec4899">[ML_OPT]</text>
            <text x="75" fill="#38bdf8">Hyperparameter tuning: Finished</text>
          </g>
          <g transform="translate(0, 111)">
            <text fill="#10b981">[STATS]</text>
            <text x="75" fill="#34d399">Model accuracy score: 98.67%</text>
          </g>
          <g transform="translate(0, 135)">
            <text fill="#38bdf8">[EXPORT]</text>
            <text x="75" fill="#e2e8f0">Saved weights to model_v2.pkl</text>
          </g>
          <g transform="translate(0, 159)">
            <text fill="#38bdf8">[DF_LOAD]</text>
            <text x="75" fill="#94a3b8">df = pd.read_csv('metrics.csv')</text>
          </g>
          <g transform="translate(0, 183)">
            <text fill="#10b981">[CLEAN]</text>
            <text x="75" fill="#e2e8f0">Handling missing values... OK</text>
          </g>
          <g transform="translate(0, 207)">
            <text fill="#a78bfa">[TRAIN]</text>
            <text x="75" fill="#e2e8f0">Fitting random forest classifer</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Dynamic Analytics Bar Charts & Scatter cluster -->
  <g transform="translate(640, 25)">
    <!-- Y Axis -->
    <line x1="10" y1="20" x2="10" y2="180" stroke="#334155" stroke-width="1.5" />
    <!-- X Axis -->
    <line x1="10" y1="180" x2="130" y2="180" stroke="#334155" stroke-width="1.5" />

    <!-- Animated Data Bars (Infinite Scaling) -->
    <rect class="bar-1" x="20" y="50" width="12" height="130" fill="url(#cyan-glow)" rx="2" />
    <rect class="bar-2" x="42" y="50" width="12" height="130" fill="url(#violet-glow)" rx="2" />
    <rect class="bar-3" x="64" y="50" width="12" height="130" fill="url(#pink-glow)" rx="2" />
    <rect class="bar-4" x="86" y="50" width="12" height="130" fill="url(#cyan-glow)" rx="2" />
    
    <!-- Floating Data Scatter dots (Clusters) -->
    <g transform="translate(50, 40)">
      <circle class="scatter-dot" cx="40" cy="-15" r="4.5" fill="#ec4899" style="animation-delay: 0.3s;" />
      <circle class="scatter-dot" cx="60" cy="-28" r="3.5" fill="#38bdf8" style="animation-delay: 1.2s;" />
      <circle class="scatter-dot" cx="25" cy="-22" r="5" fill="#a78bfa" style="animation-delay: 0.7s;" />
    </g>

    <text x="65" y="210" font-size="10" fill="#475569" font-weight="700" letter-spacing="1" text-anchor="middle" font-family="monospace">PREDICTOR_STATS</text>
  </g>
</svg>
